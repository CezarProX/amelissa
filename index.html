<!doctype html>
<html class="wide wow-animation" lang="en">
  <head>
    <title>Home - Amelissa</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" href="/images/covers/PNG to ICO Icon.ico" type="image/x-icon" />
    
    <!-- Preconnect to improve font loading -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="/fonts/Montserrat Font/Montserrat-Regular.ttf" as="font" type="font/ttf" crossorigin />
    
    <!-- Critical CSS - Load first (blocking is OK for critical styles) -->
    <link rel="stylesheet" href="/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/montserrat.css" />
    <link rel="stylesheet" href="/css/style.css" />
    
    <!-- Non-critical CSS - Defer Font Awesome -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /></noscript>
    
    <!-- Inline Critical CSS for above-the-fold content -->
    <style>
      /* Preloader critical styles */
      .preloader {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader.loaded {
        opacity: 0;
        pointer-events: none;
      }
      .cssload-speeding-wheel {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: #000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Prevent layout shift */
      body {
        margin: 0;
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Hero section placeholder to prevent CLS */
      .hero-section-modern {
        min-height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
